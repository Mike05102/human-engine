<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE HUMAN ENGINE</title><style>
:root{color-scheme:dark;--accent:#e6a36c;--bg:#100e0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2ede6;font:16px/1.7 system-ui,sans-serif}header,main,footer{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.15em}button{background:#28211d;border:1px solid #66503e;color:inherit;padding:12px 18px;border-radius:8px;font:inherit;cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent)}.hero{padding:64px 24px;background:radial-gradient(ellipse at 80% 20%,#67321c,transparent 55%),linear-gradient(120deg,#17110d,#090909);border:1px solid #372a21;border-radius:18px}h1{font-size:clamp(32px,7vw,72px);line-height:1.1;letter-spacing:-.04em;margin:16px 0}small,.muted{color:#c5a98e}h2{font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{text-align:left;min-height:115px;padding:18px}.tile strong{display:block;font-size:18px}.tile span{font-size:13px;color:#c5a98e}.tile.active{border-color:var(--accent);background:#35241a}#viewer{margin-top:30px;padding:24px;border:1px solid #4a392d;border-radius:16px;background:#171310}#scene{min-height:220px;touch-action:pan-y}#scene h3{font-size:clamp(23px,5vw,38px);line-height:1.3;margin:12px 0}#scene p{font-size:18px}.controls{display:flex;justify-content:space-between;align-items:center;gap:8px}.bar{height:4px;background:#39291f;margin:15px 0}.bar i{height:100%;display:block;background:var(--accent)}footer{font-size:12px;color:#baa998}a{color:var(--accent)}.cue{padding:14px;border-left:2px solid var(--accent);background:#211810}button:disabled{opacity:.3}#visual{width:100%;height:180px;display:block;margin-bottom:20px}
</style></head><body><header><b>THE HUMAN ENGINE</b><button id="lang">EN</button></header><main><section class="hero"><small>UNDERSTAND. VISUALIZE. TRAIN.</small><h1 id="headline">超人をつくる、<br>新しい身体訓練。</h1><p id="intro">身体の仕組みを知り、動きを思い描き、実際の訓練へ。筋肉、骨、神経、感覚から全身を理解する。</p><button id="start">訓練を始める →</button></section><h2 id="catalog">TRAINING LIBRARY</h2><div class="grid" id="grid"></div><section id="viewer"><small id="category"></small><div class="bar"><i id="progress"></i></div><div id="scene" tabindex="0" aria-live="polite"><svg id="visual" viewBox="0 0 500 180" role="img" aria-label="概念的な身体活動の模式図"><defs><linearGradient id="g"><stop stop-color="#78371e"/><stop offset=".5" stop-color="#f2aa69"/><stop offset="1" stop-color="#562214"/></linearGradient></defs><g id="art"></g></svg><h3 id="title"></h3><p id="body"></p><div class="cue" id="cue"></div></div><div class="controls"><button id="prev">←</button><span id="count"></span><button id="next">→</button></div></section><p class="muted" id="notice">画像は概念的な模式図です。イメージ訓練は運動の補助であり、能力向上を保証するものではありません。痛みや異常があれば中止してください。</p></main><footer>THE HUMAN ENGINE · v0.1 · <span id="status">無料プレビュー / ブランド名は仮称</span></footer><script>
const data=[
["MUSCLE","筋肉","Muscle",[
["ダンベルを持ち上げる","肘を曲げるとき、上腕二頭筋などの筋肉が力を発揮する。","軽い重量で、反動を使わず動きを確認する。","Lift the dumbbell","The biceps and other elbow flexors produce force.","Use a light load and avoid swinging."],
["分子が力を生み出す","筋肉の内部ではミオシンがATPを使い、アクチンを引き寄せる。","腕を曲げる間、筋肉が短くなる感覚に注意する。","Molecular motors","Myosin uses ATP to pull actin.","Notice the muscle shortening during the lift."],
["成長への信号","筋肉に加わる張力はタンパク質合成を促す信号につながる。","丁寧に下ろし、無理のない負荷で反復する。","Growth signals","Mechanical tension helps stimulate protein synthesis.","Lower the weight with control."],
["回復と成長","適切な運動、栄養、休息の積み重ねが筋肥大を支える。","次回の訓練まで十分に回復する。","Recovery","Training, nutrition and rest support hypertrophy.","Allow adequate recovery."]]],
["BONE","骨・関節","Bone & joints",[
["身体を支える骨","骨は生きた組織で、荷重に応じて長期的に再構築される。","無理のない立ち座りで足裏の支持を感じる。","Living bone","Bone remodels over time in response to loading.","Practice comfortable sit-to-stand movements."],
["関節の連携","筋肉と腱が関節を動かし、骨が力を伝える。","痛みのない範囲でゆっくり動く。","Joint coordination","Muscles and tendons move joints and bones transmit force.","Move slowly through a comfortable range."]]],
["NERVE","神経","Nervous system",[
["動きの指令","運動神経が筋肉に信号を伝え、動作を生み出す。","簡単な動作を正確に思い描いてから実行する。","Motor command","Motor neurons signal muscles to produce movement.","Rehearse a simple movement, then perform it."],
["動きを学習する","反復練習により、動作の協調や精度が改善し得る。","速度よりも正確さを優先する。","Motor learning","Practice can improve coordination and precision.","Prioritize accuracy over speed."]]],
["SENSE","感覚・平衡","Senses & balance",[
["視覚と注意","目からの信号を脳が処理し、物体の位置や動きを認識する。","座った状態で視線を動かし、周辺の物にも注意を向ける。","Visual attention","The brain processes visual information about position and movement.","While seated, notice objects in peripheral vision."],
["平衡感覚","内耳、視覚、筋肉や関節からの情報が姿勢制御を支える。","安定した支えの近くで、足裏の感覚を確認する。","Balance","Vestibular, visual and proprioceptive signals support posture.","Notice foot pressure near a stable support."]]],
["ENDURANCE","呼吸・循環","Breathing & circulation",[
["呼吸と酸素","横隔膜などが呼吸を支え、肺で酸素が血液に移る。","無理に深く吸わず、自然な呼吸を意識する。","Breathing","Respiratory muscles support ventilation and oxygen enters the blood.","Observe comfortable natural breathing."],
["全身への輸送","心臓は血液を送り、活動する筋肉へ酸素や栄養が届く。","楽な歩行で呼吸と身体の動きを感じる。","Circulation","The heart pumps blood carrying oxygen and nutrients.","Notice breathing during easy walking."]]],
["RECOVERY","回復・睡眠","Recovery",[
["休息中の身体","運動後もタンパク質の合成や組織の修復が続く。","力を抜き、休息を取る。","Recovery","Protein synthesis and tissue repair continue after exercise.","Relax and allow recovery."],
["眠りと回復","睡眠は心身の回復や学習を支える。","就寝前は刺激を減らし、睡眠時間を確保する。","Sleep","Sleep supports recovery and learning.","Reduce stimulation and allow time for sleep."]]]
];let en=false,c=0,p=0;const $=id=>document.getElementById(id);
function render(){const d=data[c],a=d[3][p],n=d[3].length; $('grid').replaceChildren(...data.map((v,i)=>{let b=document.createElement('button');b.className='tile'+(i===c?' active':'');let s=document.createElement('strong');s.textContent=v[0];let t=document.createElement('span');t.textContent=v[en?2:1];b.append(s,t);b.onclick=()=>{c=i;p=0;render();$('viewer').scrollIntoView({behavior:'smooth'})};return b}));$('category').textContent=d[0]+' / '+(en?d[2]:d[1]);$('title').textContent=a[en?3:0];$('body').textContent=a[en?4:1];$('cue').textContent=(en?'TRAIN: ':'実践：')+a[en?5:2];$('count').textContent=(p+1)+' / '+n;$('progress').style.width=(100*(p+1)/n)+'%';$('prev').disabled=p===0;$('next').disabled=p===n-1;$('art').innerHTML=Array.from({length:13},(_,i)=>'<path d="M15 '+(12+i*12)+' Q250 '+(12+i*12+Math.sin(i+c+p)*18)+' 485 '+(12+i*12)+'" stroke="url(#g)" stroke-width="'+(c===0?8:4)+'" fill="none" opacity=".8"/>').join('');}
function move(i){p=Math.max(0,Math.min(data[c][3].length-1,p+i));render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('start').onclick=()=>$('viewer').scrollIntoView({behavior:'smooth'});$('lang').onclick=()=>{en=!en;document.documentElement.lang=en?'en':'ja';$('lang').textContent=en?'JP':'EN';$('headline').innerHTML=en?'Train from<br>the inside out.':'超人をつくる、<br>新しい身体訓練。';$('intro').textContent=en?'Understand your body, visualize movement, and put it into practice.':'身体の仕組みを知り、動きを思い描き、実際の訓練へ。筋肉、骨、神経、感覚から全身を理解する。';$('start').textContent=en?'Start training →':'訓練を始める →';$('notice').textContent=en?'Conceptual illustrations. Imagery supplements physical practice and does not guarantee performance improvements. Stop if you experience pain or unusual symptoms.':'画像は概念的な模式図です。イメージ訓練は運動の補助であり、能力向上を保証するものではありません。痛みや異常があれば中止してください。';$('status').textContent=en?'Free preview / provisional brand':'無料プレビュー / ブランド名は仮称';render()};let x=0;$('scene').addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});$('scene').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>50)move(d<0?1:-1)},{passive:true});$('scene').onkeydown=e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)};render();
</script></body></html>
